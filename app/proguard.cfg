# ===== 输入法正式版 R8 规则 =====
# 只保留自己的代码（JNI 回调、Room、反射、序列化都在 com.yuyan 下），
# 第三方库(kotlin/androidx/material)交给它们自带的规则，让 R8 能删掉没用到的部分。

-keep class com.yuyan.** { *; }
-keep interface com.yuyan.** { *; }

# JNI
-keepclasseswithmembernames class * {
    native <methods>;
}

# 自定义 View（XML 里引用）
-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet);
}
-keepclasseswithmembers class * {
    public <init>(android.content.Context, android.util.AttributeSet, int);
}

-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}
-keep class * implements android.os.Parcelable {
    public static final android.os.Parcelable$Creator *;
}

# 闪退日志能看到行号；源文件名统一成 SourceFile
-keepattributes Signature,InnerClasses,Exceptions,*Annotation*,SourceFile,LineNumberTable
-renamesourcefileattribute SourceFile

# 去掉调试日志
-assumenosideeffects class android.util.Log {
    public static int v(...);
    public static int d(...);
}

-dontwarn org.apache.**
-ignorewarnings
