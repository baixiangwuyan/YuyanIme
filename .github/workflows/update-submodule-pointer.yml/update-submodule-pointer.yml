name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Point yuyansdk at new commit
        run: |
          cd yuyansdk
          git fetch origin
          git checkout 8de6943c7e0609ac89cc3c7e3c91adab99099108
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "jiaodai369@163.com"
          git add yuyansdk
          git commit -m "更新 yuyansdk 子模块：按键效果+打字延迟优化" || echo "nothing to commit"
          git push origin HEAD:master
