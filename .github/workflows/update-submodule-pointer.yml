name: Update submodule pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          cd yuyansdk
          git checkout bf94cdc0ff52a849af782064e5720986caca23b0
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "Update yuyansdk to bf94cdc" || exit 0
          git push
