name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Point yuyansdk at new commit
        run: |
          cd yuyansdk
          git fetch origin
          git checkout b4cba089112b9c1a546e64e49297387083cbe569
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "jiaodai369@163.com"
          git add yuyansdk
          git commit -m "更新 yuyansdk：出字提速 + 多彩炫光/彩虹背景 + CyIME 按键音色（7a8f038）" || echo "nothing to commit"
          git push origin HEAD:master
