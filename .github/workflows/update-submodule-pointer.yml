name: Update submodule pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          cd yuyansdk
          git checkout 8da9af62a1c9738a70ac2209a16d3119f36b0851
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "Update yuyansdk to 8da9af6" || exit 0
          git push
