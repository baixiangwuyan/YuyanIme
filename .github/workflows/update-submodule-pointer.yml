name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update yuyansdk pointer
        run: |
          cd yuyansdk
          git checkout 789d2b2bc07709648180f8f02d94aa908c48cb97
          cd ..
          git add yuyansdk
          git config user.name "baixiangwuyan"
          git config user.email "jiaodai369@163.com"
          git commit -m "花花：更新 yuyansdk 指针到 789d2b2（P30底边14dp）" || echo "no changes"
          git push
