name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Point yuyansdk at 044fc8a7e5db624093cf5f5d2c65ba0dac733f74
        run: |
          cd yuyansdk
          git checkout 044fc8a7e5db624093cf5f5d2c65ba0dac733f74
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "更新 yuyansdk：气泡小三角改功能键底色 + 换行键高光只沿键边"
          git push
