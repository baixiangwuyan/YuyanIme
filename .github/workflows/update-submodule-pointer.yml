name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Point yuyansdk at d133c84eddd72b801598805fad789087ff1f6edc
        run: |
          cd yuyansdk
          git checkout d133c84eddd72b801598805fad789087ff1f6edc
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "更新 yuyansdk：键内炫光改淡糖果色半透明 + 玻璃效果键面改不透明"
          git push
