name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update yuyansdk pointer
        run: |
          cd yuyansdk
          git checkout fc6c4b859151d2e7050208f67eb5bafe35ec4099
          cd ..
          git add yuyansdk
          git config user.name "baixiangwuyan"
          git config user.email "jiaodai369@163.com"
          git commit -m "花花：更新 yuyansdk 指针到 fc6c4b8（P30底边3dp）" || echo "no changes"
          git push
