name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Point yuyansdk at 4953ae23ed8c905bc6fcdb2373d698a273bd3a16
        run: |
          cd yuyansdk
          git checkout 4953ae23ed8c905bc6fcdb2373d698a273bd3a16
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "更新 yuyansdk：菜单加「玻璃」开关 + 彩色键三档标准亮边"
          git push
