name: Update submodule pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          cd yuyansdk
          git checkout a321150c0594f0b4477796b24e364b8a67995552
          cd ..
          git config user.name "baixiangwuyan"
          git config user.email "baixiangwuyan@users.noreply.github.com"
          git add yuyansdk
          git commit -m "Update yuyansdk to a321150" || exit 0
          git push
