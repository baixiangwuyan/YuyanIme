name: Update yuyansdk pointer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-pointer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Update yuyansdk pointer
        run: |
          cd yuyansdk
          git checkout a7746d5ccc936164dbc7ff4fc0c9a1a97b594094
          cd ..
          git add yuyansdk
          git config user.name "baixiangwuyan"
          git config user.email "jiaodai369@163.com"
          git commit -m "花花：更新 yuyansdk 指针到 a7746d5（窄键自适应）" || echo "no changes"
          git push
