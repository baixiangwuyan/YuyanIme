name: Build Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "缺少 KEYSTORE_BASE64 secret"; exit 1; fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Build Release APK (R8) - arm64
        env:
          RELEASE_STORE_FILE: keystore/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleOfflineRelease
          mkdir -p artifacts
          APK=$(ls app/build/outputs/apk/offline/release/*.apk | head -1)
          case "$APK" in *unsigned*) echo "APK 未签名，检查 Secrets"; exit 1;; esac
          cp "$APK" artifacts/yuyan-arm64-release.apk

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-arm64-release
          path: artifacts/yuyan-arm64-release.apk
