name: Build Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK (R8) - arm64
        run: |
          ./gradlew :app:assembleOfflineRelease
          mkdir -p artifacts
          cp app/build/outputs/apk/offline/release/*.apk artifacts/yuyan-arm64-release.apk

      - name: Upload APK arm64
        uses: actions/upload-artifact@v4
        with:
          name: yuyan-arm64-release
          path: artifacts/yuyan-arm64-release.apk
